name: Build Xiaomi BE10000 U-Boot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  BOARD: ipq9574_xiaomi_be10000
  IMAGE: openwrt-ipq9574_xiaomi_be10000-u-boot.mbn

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Pre-build board validation
        run: |
          set -eux
          test -f "configs/${BOARD}_defconfig"
          test -f arch/arm/dts/ipq9574-xiaomi-be10000.dts
          grep -F 'CONFIG_IPQ9574_XIAOMI_BE10000=y' "configs/${BOARD}_defconfig"
          grep -F 'CONFIG_BOARD_DISPLAY_NAME="Xiaomi BE10000"' "configs/${BOARD}_defconfig"
          grep -F 'CONFIG_IPQ9574_QCA_AQUANTIA_PHY=y' "configs/${BOARD}_defconfig"
          grep -F '#include "ipq9574-al02-c4.dts"' arch/arm/dts/ipq9574-xiaomi-be10000.dts
          grep -F 'model = "Xiaomi BE10000 (RC01)"' arch/arm/dts/ipq9574-xiaomi-be10000.dts
          grep -A5 'reset {' arch/arm/dts/ipq9574-xiaomi-be10000.dts | grep -F 'gpio = <45>;'
          grep -F 'machid = <0x8050301>' arch/arm/dts/ipq9574-al02-c4.dts
          grep -F 'ipq9574-xiaomi-be10000.dtb' arch/arm/dts/Makefile
          git diff --check HEAD^ HEAD

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git gettext \
            libssl-dev python3 wget cpio flex bison bc rsync nodejs npm gzip \
            zopfli device-tree-compiler file
          sudo npm install -g html-minifier-terser clean-css terser svgo

      - name: Fetch the required GCC 5.2 toolchain
        run: |
          git clone --depth 1 \
            https://github.com/1980490718/toolchain-arm_cortex-a7_gcc-5.2.0.git \
            ../staging_dir
          test -x ../staging_dir/toolchain-arm_cortex-a7_gcc-5.2.0_musl-1.1.16_eabi/bin/arm-openwrt-linux-gcc

      - name: Build BE10000 U-Boot
        run: |
          chmod +x build.sh
          ./build.sh "${BOARD}"

      - name: Post-build static verification
        run: |
          set -euxo pipefail
          test -f "bin/${IMAGE}"
          test -f dtb_combined.bin
          file "bin/${IMAGE}"
          ls -l "bin/${IMAGE}" dtb_combined.bin
          python3 scripts/verify_be10000.py "bin/${IMAGE}" dtb_combined.bin | tee verification.txt
          sha256sum "bin/${IMAGE}" | tee SHA256SUMS.txt
          cp "bin/${IMAGE}" "${IMAGE}"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: be10000-u-boot-${{ github.run_number }}
          path: |
            ${{ env.IMAGE }}
            SHA256SUMS.txt
            verification.txt
          if-no-files-found: error

      - name: Publish downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: be10000-build-${{ github.run_number }}
          name: BE10000 U-Boot build ${{ github.run_number }}
          generate_release_notes: true
          files: |
            ${{ env.IMAGE }}
            SHA256SUMS.txt
            verification.txt
